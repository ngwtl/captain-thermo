<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Captain Thermo — Usage &amp; Teaching Signal</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .bar { background: #3b82f6; height: 10px; border-radius: 999px; }
  .hm-grid { display: grid; grid-template-columns: 2.6rem repeat(24, 1fr); gap: 2px; min-width: 620px; }
  .hm-cell { aspect-ratio: 1; border-radius: 2px; box-shadow: inset 0 0 0 1px #374151; }
  .hm-lab { font-size: 0.7rem; color: #9ca3af; display: flex; align-items: center; }
  .hm-hr  { font-size: 0.62rem; color: #6b7280; text-align: center; }
  th { font-weight: 600; text-align: left; }
  td, th { padding: 5px 10px; border-bottom: 1px solid #1f2937; font-size: 0.875rem; }
  @media print { .noprint { display: none } body { background: #fff; color: #000 } }
</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
<div class="max-w-5xl mx-auto px-5 py-8">
  <header class="mb-8">
    <h1 class="text-2xl font-bold">Captain Thermo — Usage &amp; Teaching Signal</h1>
    <p class="text-sm text-gray-400 mt-1">MS1016 Thermodynamics of Materials · NTU</p>
    <p class="text-xs text-gray-500 mt-2">
      Pseudonymous aggregates. No student work, submissions or feedback text is stored.
    </p>
  </header>

  <div id="gate" class="noprint mb-6">
    <input id="pass" type="password" placeholder="Access code"
           class="bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm" />
    <button id="go" class="bg-blue-600 hover:bg-blue-500 rounded px-4 py-2 text-sm font-medium">Load</button>
    <span id="msg" class="text-sm text-red-400 ml-3"></span>
  </div>

  <div id="out" class="hidden space-y-8"></div>

  <footer class="noprint mt-10 pt-6 border-t border-gray-800 text-xs text-gray-500">
    <a id="csv" href="#" class="text-blue-400 hover:underline">Download full event CSV</a>
    · for analysis in R / Python / SPSS · one row per request
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const esc = (s) => String(s ?? "—").replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function card(title, subtitle, body) {
  return `<section><h2 class="text-lg font-semibold mb-1">${title}</h2>
    ${subtitle ? `<p class="text-xs text-gray-400 mb-3">${subtitle}</p>` : ""}
    <div class="bg-gray-800 rounded-lg p-4 overflow-x-auto">${body}</div></section>`;
}
function table(rows, cols) {
  if (!rows || !rows.length) return '<p class="text-sm text-gray-500">No data yet.</p>';
  return `<table class="w-full"><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(c[1](r))}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
// Sequential single-hue ramp, low -> high. Validated against this dashboard's
// card surface (#1f2937): monotone lightness, adjacent steps >= 0.06 apart, and
// the darkest step clears 2:1 against the surface so "1 request" is visibly
// different from "none". Do not substitute a rainbow — magnitude needs one hue.
const RAMP = ["#256abf", "#3987e5", "#6da7ec", "#9ec5f4", "#cde2fb"];
let heatMode = "week";   // "week" = mean per occurrence of that weekday

function heatmap(rows, weekdayCounts, windowInfo) {
  if (!rows || !rows.length) return '<p class="text-sm text-gray-500">No data yet.</p>';
  const grid = {};
  rows.forEach(r => { grid[`${r.dow}|${r.hour}`] = r.n; });
  const div = (d) => (heatMode === "week" && weekdayCounts && weekdayCounts[d]) ? weekdayCounts[d] : 1;
  const val = (d, h) => (grid[`${d}|${h}`] || 0) / div(d);
  let max = 0;
  for (let d = 0; d < 7; d++) for (let h = 0; h < 24; h++) max = Math.max(max, val(d, h));
  const fmt = (v) => heatMode === "week" ? (v < 0.05 ? "0" : v.toFixed(1)) : String(Math.round(v));

  // Quantile bucketing, not linear. Usage is heavily skewed — in testing the
  // busiest hour was 10x the 95th percentile, and a linear scale put 67 of 68
  // active cells in the same shade with one lone outlier at the top. The map
  // then showed nothing. Quantiles give each step an equal share of cells, so
  // the pattern reads whatever the distribution.
  // The cost is that colour spacing is no longer proportional to magnitude, so
  // the legend prints the actual thresholds and every cell carries an exact
  // value on hover.
  const nonzero = [];
  for (let d = 0; d < 7; d++) for (let h = 0; h < 24; h++) { const v = val(d, h); if (v > 0) nonzero.push(v); }
  nonzero.sort((a, b) => a - b);
  const cuts = RAMP.slice(1).map((_, i) =>
    nonzero.length ? nonzero[Math.floor(((i + 1) / RAMP.length) * (nonzero.length - 1))] : 0);
  const colour = (v) => {
    if (v <= 0) return "transparent";
    let i = 0;
    while (i < cuts.length && v > cuts[i]) i++;
    return RAMP[i];
  };

  let cells = "";
  for (let d = 0; d < 7; d++) {
    cells += `<div class="hm-lab">${DOW[d]}</div>`;
    for (let h = 0; h < 24; h++) {
      const v = val(d, h), raw = grid[`${d}|${h}`] || 0;
      const tip = heatMode === "week"
        ? `${DOW[d]} ${String(h).padStart(2,"0")}:00 — ${fmt(v)} per week (${raw} total over ${div(d)} ${DOW[d]}s)`
        : `${DOW[d]} ${String(h).padStart(2,"0")}:00 — ${raw} request${raw===1?"":"s"}`;
      cells += `<div class="hm-cell" style="background:${colour(v)}" title="${esc(tip)}"></div>`;
    }
  }
  let hours = '<div class="hm-lab"></div>';
  for (let h = 0; h < 24; h++) hours += `<div class="hm-hr">${h % 3 === 0 ? String(h).padStart(2,"0") : ""}</div>`;

  // Legend prints the quantile thresholds, since the steps aren't linear.
  const legend = RAMP.map((c, i) =>
    `<span class="inline-flex flex-col items-center gap-0.5">
       <span class="inline-block w-8 h-2.5 rounded-sm" style="background:${c}"></span>
       <span class="text-[0.6rem] text-gray-500">${i < cuts.length ? "\u2264" + fmt(cuts[i]) : ">" + fmt(cuts[cuts.length-1])}</span>
     </span>`).join("");

  return `<div class="mb-3 flex items-center gap-3 text-xs">
      <button id="hm-toggle" class="px-2 py-1 rounded bg-gray-700 hover:bg-gray-600">
        ${heatMode === "week" ? "Showing: average per week" : "Showing: total over the whole period"}
      </button>
      ${windowInfo ? `<span class="text-gray-500">${esc(windowInfo.start)} to ${esc(windowInfo.end)} · ${windowInfo.weeks} weeks</span>` : ""}
    </div>
    <div class="hm-grid">${cells}${hours}</div>
    <div class="mt-3 flex items-center gap-2 text-xs text-gray-400">
      <span>less</span>${legend}<span>more</span>
      <span class="ml-2 text-gray-500">peak ${fmt(max)}${heatMode === "week" ? "/week" : ""} in one hour</span>
    </div>`;
}

function hbar(rows, labelFn, valFn) {
  if (!rows || !rows.length) return '<p class="text-sm text-gray-500">No data yet.</p>';
  const max = Math.max(...rows.map(valFn)) || 1;
  return rows.map(r => `<div class="flex items-center gap-3 mb-1.5">
      <div class="w-28 text-xs text-gray-400 shrink-0">${esc(labelFn(r))}</div>
      <div class="bar" style="width:${(valFn(r)/max*100).toFixed(1)}%"></div>
      <div class="text-xs text-gray-500">${valFn(r)}</div></div>`).join("");
}

async function load() {
  const pass = $("pass").value.trim();
  const r = await fetch("/api/admin/stats", {headers: {"X-Passcode": pass, "X-Client-Id": "dashboard"}});
  if (!r.ok) { $("msg").textContent = r.status === 401 ? "Wrong access code." : `Error ${r.status}`; return; }
  const d = await r.json();
  sessionStorage.setItem("ct_admin", pass);
  $("csv").href = "#";
  $("csv").onclick = async (e) => {
    e.preventDefault();
    const resp = await fetch("/api/admin/export.csv", {headers: {"X-Passcode": pass, "X-Client-Id": "dashboard"}});
    const blob = await resp.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "captain_thermo_events.csv"; a.click();
  };

  const t = d.totals || {};
  const out = [];

  const warn = (d.collection || {}).warnings || [];
  if (warn.length) out.push(`<section class="bg-amber-950 border border-amber-700 rounded-lg p-4">
    <div class="font-semibold text-amber-300 mb-2">⚠ Data collection needs attention</div>
    <ul class="list-disc pl-5 text-sm text-amber-100 space-y-1">
      ${warn.map(w => `<li>${esc(w)}</li>`).join("")}</ul></section>`);
  out.push(`<div class="grid grid-cols-3 gap-4">
    ${[["Requests", t.n ?? 0], ["Distinct students", t.students ?? 0], ["API spend", "$" + (t.spend ?? 0)]]
      .map(([k,v]) => `<div class="bg-gray-800 rounded-lg p-4">
        <div class="text-2xl font-bold">${esc(v)}</div>
        <div class="text-xs text-gray-400 mt-1">${k}</div></div>`).join("")}</div>`);

  out.push(card("Where students go wrong",
    "Grader classification by lecture and error type — the teaching signal. Sorted by frequency.",
    table(d.misconceptions, [["Lecture", r=>r.topic], ["Error type", r=>(r.error_type||"").replace(/_/g," ")],
                             ["Submissions", r=>r.n], ["Mean score", r=>r.avg_score]])));

  out.push(card("Hardest concepts",
    "Lowest mean score, minimum 2 submissions. These are the candidates for re-teaching.",
    table(d.concepts, [["Lecture", r=>r.topic], ["Concept", r=>r.concept],
                       ["n", r=>r.n], ["Mean score", r=>r.avg_score]])));

  const imp = (d.improvement || [])[0];
  if (imp && imp.pairs) {
    const pct = (n) => `${n} (${Math.round(n / imp.pairs * 100)}%)`;
    out.push(card("Did the feedback help?",
      "Paired submissions: the same student attempting the same concept again after being graded. " +
      "Pairs more than 72h apart are excluded — those aren't a response to feedback.",
      `<div class="grid grid-cols-4 gap-4 mb-4">
        ${[["Pairs", imp.pairs], ["Mean before", imp.mean_before], ["Mean after", imp.mean_after],
           ["Mean gain", (imp.mean_gain > 0 ? "+" : "") + imp.mean_gain]]
          .map(([k,v]) => `<div><div class="text-xl font-bold">${esc(v)}</div>
            <div class="text-xs text-gray-400">${k}</div></div>`).join("")}
       </div>
       ${table([{}], [["Improved", ()=>pct(imp.improved)], ["Unchanged", ()=>pct(imp.unchanged)],
                      ["Got worse", ()=>pct(imp.worse)],
                      ["Median gap", ()=>Math.round(imp.mean_minutes_between||0) + " min"]])}`));
    if ((d.improvement_by_topic||[]).length)
      out.push(card("Improvement by lecture", "Where feedback lands, and where it doesn't.",
        table(d.improvement_by_topic, [["Lecture", r=>r.topic], ["Pairs", r=>r.pairs],
                                       ["Mean gain", r=>(r.mean_gain>0?"+":"")+r.mean_gain]])));
  }

  if ((d.conversation_depth||[]).length)
    out.push(card("Conversation depth",
      "Turns per tutor conversation. Tests whether Socratic questioning gets students there — " +
      "a long tail means students are working it through; a spike at 1 means they gave up.",
      hbar(d.conversation_depth, r=>r.turns + (r.turns===1?" turn":" turns"), r=>r.conversations)));

  if ((d.solution_reveal||[]).length)
    out.push(card("Time before revealing the worked solution",
      "A short delay reads as answer-seeking; a long one as a genuine attempt first.",
      hbar(d.solution_reveal, r=>r.bucket, r=>r.n)));

  out.push(card("Tool usage", "Which tools students actually reach for.",
    table(d.by_tool, [["Tool", r=>r.tool], ["Requests", r=>r.n], ["Students", r=>r.students],
                      ["Spend", r=>"$"+(r.spend??0)], ["Mean latency", r=>Math.round(r.avg_ms||0)+" ms"]])));

  out.push(card("When students work",
    `Requests by local hour and weekday (${esc(d.tz_offset || "+8 hours")} from UTC). ` +
    `The per-week view divides each cell by how many of that weekday actually ` +
    `occurred, so a quiet Monday doesn't inflate the other Mondays. Hover for detail.`,
    heatmap(d.heatmap, d.weekday_counts, d.window)));

  const weak = d.weak_concepts || [];
  if (weak.length) out.push(card("Where understanding is weak",
    "Ranked by mean score, minimum 3 attempts across 2+ students. " +
    "<em>Students</em> separates one person struggling repeatedly from a cohort-wide gap; " +
    "<em>main error</em> decides the remedy — conceptual means reteach, algebra means more practice.",
    table(weak, [["Lecture", r=>r.topic], ["Concept", r=>r.concept], ["Attempts", r=>r.attempts],
                 ["Students", r=>r.students], ["Mean", r=>r.mean_score],
                 ["% wrong", r=>r.pct_wrong + "%"], ["Main error", r=>(r.main_error||"").replace(/_/g," ")]])));

  const gaps = d.persistent_gaps || [];
  if (gaps.length) out.push(card("Where feedback didn't land",
    "Concepts students attempted <em>again</em> after being told what went wrong. " +
    "A near-zero gain means feedback already had its chance — that's a teaching gap, not a slip. " +
    "Sorted worst first.",
    table(gaps, [["Lecture", r=>r.topic], ["Concept", r=>r.concept], ["Retries", r=>r.retries],
                 ["Before", r=>r.mean_before], ["After", r=>r.mean_after],
                 ["Gain", r=>(r.mean_gain>0?"+":"")+r.mean_gain]])));

  const sat = (d.satisfaction || [])[0];
  if (sat && sat.rated) out.push(card("Student satisfaction",
    "Thumbs on grader feedback. The row that matters is <em>incorrect</em> — students told they " +
    "were wrong still rating the feedback helpful is the sign it teaches rather than flatters.",
    `<div class="grid grid-cols-3 gap-4 mb-4">
       ${[["Rated", sat.rated], ["Helpful", sat.helpful], ["Not helpful", sat.not_helpful]]
         .map(([k,v]) => `<div><div class="text-xl font-bold">${esc(v)}</div>
           <div class="text-xs text-gray-400">${k}</div></div>`).join("")}
     </div>
     ${table(d.satisfaction_by_verdict, [["Verdict", r=>(r.verdict||"").replace(/_/g," ")],
                                         ["Rated", r=>r.rated], ["% helpful", r=>r.pct_helpful + "%"]])}`));

  out.push(card("Activity by lecture", "", hbar(d.by_topic, r=>r.topic, r=>r.n)));
  out.push(card("Time of day (UTC)", "Shift by +8h for Singapore time.", hbar(d.by_hour, r=>String(r.hour).padStart(2,"0")+":00", r=>r.n)));
  out.push(card("Day of week", "", hbar(d.by_dow, r=>DOW[r.dow] ?? r.dow, r=>r.n)));
  out.push(card("Return usage", "How many distinct days each student used the tool — the adoption curve.",
    table(d.retention, [["Days used", r=>r.days], ["Students", r=>r.students]])));
  out.push(card("Grading outcomes", "", table(d.verdicts, [["Verdict", r=>(r.verdict||"").replace(/_/g," ")], ["n", r=>r.n]])));
  out.push(card("Daily volume and spend", "",
    table((d.by_day||[]).slice(-30), [["Day", r=>r.day], ["Requests", r=>r.n], ["Students", r=>r.students], ["Spend", r=>"$"+(r.spend??0)]])));

  if (d.errors && d.errors.length)
    out.push(card("Failed requests", "Worth watching — spend-cap and config failures show up here.",
      table(d.errors, [["Kind", r=>r.error_kind], ["n", r=>r.n]])));

  $("out").innerHTML = out.join("");
  const tgl = $("hm-toggle");
  if (tgl) tgl.onclick = () => { heatMode = heatMode === "week" ? "total" : "week"; load(); };
  $("out").classList.remove("hidden");
  $("gate").classList.add("hidden");
}

$("go").onclick = load;
$("pass").addEventListener("keydown", e => { if (e.key === "Enter") load(); });
const saved = sessionStorage.getItem("ct_admin");
if (saved) { $("pass").value = saved; load(); }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Captain Thermo — Usage &amp; Teaching Signal</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .bar { background: #3b82f6; height: 10px; border-radius: 999px; }
  th { font-weight: 600; text-align: left; }
  td, th { padding: 5px 10px; border-bottom: 1px solid #1f2937; font-size: 0.875rem; }
  @media print { .noprint { display: none } body { background: #fff; color: #000 } }
</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
<div class="max-w-5xl mx-auto px-5 py-8">
  <header class="mb-8">
    <h1 class="text-2xl font-bold">Captain Thermo — Usage &amp; Teaching Signal</h1>
    <p class="text-sm text-gray-400 mt-1">MS1016 Thermodynamics of Materials · NTU</p>
    <p class="text-xs text-gray-500 mt-2">
      Pseudonymous aggregates. No student work, submissions or feedback text is stored.
    </p>
  </header>

  <div id="gate" class="noprint mb-6">
    <input id="pass" type="password" placeholder="Access code"
           class="bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm" />
    <button id="go" class="bg-blue-600 hover:bg-blue-500 rounded px-4 py-2 text-sm font-medium">Load</button>
    <span id="msg" class="text-sm text-red-400 ml-3"></span>
  </div>

  <div id="out" class="hidden space-y-8"></div>

  <footer class="noprint mt-10 pt-6 border-t border-gray-800 text-xs text-gray-500">
    <a id="csv" href="#" class="text-blue-400 hover:underline">Download full event CSV</a>
    · for analysis in R / Python / SPSS · one row per request
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "—").replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

function card(title, subtitle, body) {
  return `<section><h2 class="text-lg font-semibold mb-1">${title}</h2>
    ${subtitle ? `<p class="text-xs text-gray-400 mb-3">${subtitle}</p>` : ""}
    <div class="bg-gray-800 rounded-lg p-4 overflow-x-auto">${body}</div></section>`;
}
function table(rows, cols) {
  if (!rows || !rows.length) return '<p class="text-sm text-gray-500">No data yet.</p>';
  return `<table class="w-full"><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(c[1](r))}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function hbar(rows, labelFn, valFn) {
  if (!rows || !rows.length) return '<p class="text-sm text-gray-500">No data yet.</p>';
  const max = Math.max(...rows.map(valFn)) || 1;
  return rows.map(r => `<div class="flex items-center gap-3 mb-1.5">
      <div class="w-28 text-xs text-gray-400 shrink-0">${esc(labelFn(r))}</div>
      <div class="bar" style="width:${(valFn(r)/max*100).toFixed(1)}%"></div>
      <div class="text-xs text-gray-500">${valFn(r)}</div></div>`).join("");
}

async function load() {
  const pass = $("pass").value.trim();
  const r = await fetch("/api/admin/stats", {headers: {"X-Passcode": pass, "X-Client-Id": "dashboard"}});
  if (!r.ok) { $("msg").textContent = r.status === 401 ? "Wrong access code." : `Error ${r.status}`; return; }
  const d = await r.json();
  sessionStorage.setItem("ct_admin", pass);
  $("csv").href = "#";
  $("csv").onclick = async (e) => {
    e.preventDefault();
    const resp = await fetch("/api/admin/export.csv", {headers: {"X-Passcode": pass, "X-Client-Id": "dashboard"}});
    const blob = await resp.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "captain_thermo_events.csv"; a.click();
  };

  const t = d.totals || {};
  const out = [];

  const warn = (d.collection || {}).warnings || [];
  if (warn.length) out.push(`<section class="bg-amber-950 border border-amber-700 rounded-lg p-4">
    <div class="font-semibold text-amber-300 mb-2">⚠ Data collection needs attention</div>
    <ul class="list-disc pl-5 text-sm text-amber-100 space-y-1">
      ${warn.map(w => `<li>${esc(w)}</li>`).join("")}</ul></section>`);
  out.push(`<div class="grid grid-cols-3 gap-4">
    ${[["Requests", t.n ?? 0], ["Distinct students", t.students ?? 0], ["API spend", "$" + (t.spend ?? 0)]]
      .map(([k,v]) => `<div class="bg-gray-800 rounded-lg p-4">
        <div class="text-2xl font-bold">${esc(v)}</div>
        <div class="text-xs text-gray-400 mt-1">${k}</div></div>`).join("")}</div>`);

  out.push(card("Where students go wrong",
    "Grader classification by lecture and error type — the teaching signal. Sorted by frequency.",
    table(d.misconceptions, [["Lecture", r=>r.topic], ["Error type", r=>(r.error_type||"").replace(/_/g," ")],
                             ["Submissions", r=>r.n], ["Mean score", r=>r.avg_score]])));

  out.push(card("Hardest concepts",
    "Lowest mean score, minimum 2 submissions. These are the candidates for re-teaching.",
    table(d.concepts, [["Lecture", r=>r.topic], ["Concept", r=>r.concept],
                       ["n", r=>r.n], ["Mean score", r=>r.avg_score]])));

  out.push(card("Tool usage", "Which tools students actually reach for.",
    table(d.by_tool, [["Tool", r=>r.tool], ["Requests", r=>r.n], ["Students", r=>r.students],
                      ["Spend", r=>"$"+(r.spend??0)], ["Mean latency", r=>Math.round(r.avg_ms||0)+" ms"]])));

  out.push(card("Activity by lecture", "", hbar(d.by_topic, r=>r.topic, r=>r.n)));
  out.push(card("Time of day (UTC)", "Shift by +8h for Singapore time.", hbar(d.by_hour, r=>String(r.hour).padStart(2,"0")+":00", r=>r.n)));
  out.push(card("Day of week", "", hbar(d.by_dow, r=>DOW[r.dow] ?? r.dow, r=>r.n)));
  out.push(card("Return usage", "How many distinct days each student used the tool — the adoption curve.",
    table(d.retention, [["Days used", r=>r.days], ["Students", r=>r.students]])));
  out.push(card("Grading outcomes", "", table(d.verdicts, [["Verdict", r=>(r.verdict||"").replace(/_/g," ")], ["n", r=>r.n]])));
  out.push(card("Daily volume and spend", "",
    table((d.by_day||[]).slice(-30), [["Day", r=>r.day], ["Requests", r=>r.n], ["Students", r=>r.students], ["Spend", r=>"$"+(r.spend??0)]])));

  if (d.errors && d.errors.length)
    out.push(card("Failed requests", "Worth watching — spend-cap and config failures show up here.",
      table(d.errors, [["Kind", r=>r.error_kind], ["n", r=>r.n]])));

  $("out").innerHTML = out.join("");
  $("out").classList.remove("hidden");
  $("gate").classList.add("hidden");
}

$("go").onclick = load;
$("pass").addEventListener("keydown", e => { if (e.key === "Enter") load(); });
const saved = sessionStorage.getItem("ct_admin");
if (saved) { $("pass").value = saved; load(); }
</script>
</body>
</html>

services:
  - type: web
    name: captain-thermo
    runtime: docker
    region: singapore
    plan: starter
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false           # set in Render dashboard after first deploy
      - key: APP_PASSCODE
        sync: false           # set in Render dashboard — share with students
      - key: ANTHROPIC_MODEL_DEFAULT
        value: claude-sonnet-4-6
      - key: ANTHROPIC_MODEL_GRADER
        value: claude-opus-5
      - key: ANTHROPIC_MODEL_FLASHCARDS
        value: claude-haiku-4-5
      - key: CACHE_TTL         # adaptive: 1h while busy, 5m when quiet
        value: adaptive
      - key: CACHE_BUSY_THRESHOLD   # requests/hour above which 1h repays its 2x write
        value: "3"
      - key: USE_BANK          # serve practice/flashcards from the committed bank
        value: "true"
      - key: GRADER_EFFORT     # medium: same verdicts as high, ~30% faster
        value: medium
      - key: CA_FOR_GRADER     # past CAs in the grader's context (+40% corpus)
        value: "true"
      - key: CA_FOR_TUTOR      # tutor doesn't need them; keeps its corpus at 94K
        value: "false"
      - key: INCLUDE_PROBLEM_SHEETS   # solutions already restate every problem
        value: "false"
      - key: PREWARM_ON_STARTUP
        value: "true"
      - key: PREWARM_INTERVAL_MIN     # 0 disables; only warms models in recent use
        value: "50"
      - key: PREWARM_IDLE_AFTER_MIN
        value: "90"
      # Counted per student (X-Client-Id), not per IP — see README.
      - key: RATE_LIMIT_PER_MIN
        value: "30"
      # Every tutor chat turn counts as one request, so a day's budget is
      # really a conversation budget: 120 ≈ 8-10 tutor conversations. The
      # first week of term showed engaged students hitting the old 40 cap
      # mid-dialogue (a fully-capped chat day cost $1.61-$3.10, warm cache).
      # The org-level spend cap is the budget control, not this.
      - key: RATE_LIMIT_PER_DAY
        value: "120"
      # Per-IP abuse backstop; must exceed a whole tutorial group on campus NAT.
      - key: IP_RATE_LIMIT_PER_MIN
        value: "600"
      - key: IP_RATE_LIMIT_PER_DAY
        value: "20000"
      # Analytics. The container filesystem is wiped on every deploy, so the
      # event DB must live on a mounted disk or a term of data disappears.
      - key: ANALYTICS_ENABLED
        value: "true"
      - key: ANALYTICS_DB
        value: /var/data/analytics.db
      - key: ANALYTICS_SALT     # set in the dashboard; pseudonyms break if it changes
        sync: false
    healthCheckPath: /api/health
    # NOTE: attaching a disk pins the service to a single instance. Fine here
    # (the rate limiter and cache counters are already in-process), but it
    # rules out horizontal scaling without moving to Postgres first.
    disk:
      name: analytics-data
      mountPath: /var/data
      sizeGB: 1

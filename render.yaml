services:
  - type: web
    name: captain-thermo
    runtime: docker
    region: singapore
    plan: starter
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false           # set in Render dashboard after first deploy
      - key: APP_PASSCODE
        sync: false           # set in Render dashboard — share with students
      - key: ANTHROPIC_MODEL_DEFAULT
        value: claude-sonnet-4-6
      - key: ANTHROPIC_MODEL_GRADER
        value: claude-opus-5
      - key: ANTHROPIC_MODEL_FLASHCARDS
        value: claude-haiku-4-5
      - key: CACHE_TTL
        value: 1h
      - key: USE_BANK          # serve practice/flashcards from the committed bank
        value: "true"
      - key: GRADER_EFFORT     # medium: same verdicts as high, ~30% faster
        value: medium
      - key: PREWARM_ON_STARTUP
        value: "true"
      - key: PREWARM_INTERVAL_MIN     # 0 disables; only warms models in recent use
        value: "50"
      - key: PREWARM_IDLE_AFTER_MIN
        value: "90"
      # Counted per student (X-Client-Id), not per IP — see README.
      - key: RATE_LIMIT_PER_MIN
        value: "30"
      # 40/day is generous (a heavy student does ~10/week) and cuts the
      # theoretical worst-case spend across 170 students by ~7x.
      - key: RATE_LIMIT_PER_DAY
        value: "40"
      # Per-IP abuse backstop; must exceed a whole tutorial group on campus NAT.
      - key: IP_RATE_LIMIT_PER_MIN
        value: "600"
      - key: IP_RATE_LIMIT_PER_DAY
        value: "20000"
    healthCheckPath: /api/health

services:
  - type: web
    name: captain-thermo
    runtime: docker
    region: singapore
    plan: starter
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false           # set in Render dashboard after first deploy
      - key: APP_PASSCODE
        sync: false           # set in Render dashboard — share with students
      - key: ANTHROPIC_MODEL_DEFAULT
        value: claude-sonnet-4-6
      - key: ANTHROPIC_MODEL_GRADER
        value: claude-opus-4-7
      - key: RATE_LIMIT_PER_MIN
        value: "30"
      - key: RATE_LIMIT_PER_DAY
        value: "300"
    healthCheckPath: /api/health
